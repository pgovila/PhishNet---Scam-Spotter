# PhishNet Scoring Rules Configuration
# Edit this file to adjust scoring without code changes.
# Reload happens at app startup.
#
# Categories: bait (borrowed trust), hook (pressure/fear), ask (risky action)
# Each rule: id, category, label, label_hi, points, reason, reason_hi, patterns (regex list)
# Patterns are case-insensitive, applied after NFKC normalisation.

version: "1.1"

# ── Default mode ──────────────────────────────────────────────────────────────
default:
  act_now_bonus: 15          # added when Ask + (Bait or Hook) co-occur
  max_score: 100
  no_ask_cap: 54             # cap when no Ask finding is present

  tiers:
    low:    [0, 24]
    medium: [25, 54]
    high:   [55, 100]

  rules:
    # ── BAIT ──────────────────────────────────────────────────────────────────
    - id: bait_brand
      category: bait
      label: Named brand / authority
      label_hi: "ब्रांड/अधिकारी का नाम"
      points: 10
      reason: "Impersonates a known trusted bank, brand, or government authority to lower your guard."
      reason_hi: "विश्वास हासिल करने और आपका ध्यान भटकाने के लिए किसी जाने-माने बैंक, ब्रांड या सरकारी संस्था के नाम का दुरुपयोग किया गया है।"
      patterns:
        # Indian banks
        - '\bSBI\b'
        - '\bHDFC\b'
        - '\bICICI\b'
        - '\bAxis\s*Bank\b'
        - '\bKotak\b'
        - '\bPNB\b'
        - '\bBank\s*of\s*Baroda\b'
        - '\bCanara\s*Bank\b'
        - '\bUnion\s*Bank\b'
        - '\bBOI\b'
        - '\bIDBI\b'
        - '\bYes\s*Bank\b'
        - '\bIndian\s*Bank\b'
        - '\bBOB\b'
        # Payment / fintech
        - '\bPaytm\b'
        - '\bPhonePe\b'
        - '\bGoogle\s*Pay\b'
        - '\bGPay\b'
        - '\bBharat\s*Pe\b'
        - '\bRazorpay\b'
        - '\bCRED\b'
        - '\bNPCI\b'
        - '\bUPI\b'
        # Law enforcement & investigative agencies (Digital Arrest scams)
        - '\bCBI\b'
        - '\bED\b'
        - '\bEnforcement\s*Directorate\b'
        - '\bNarcotics\s*Control\s*Bureau\b'
        - '\bNCB\b'
        - '\bCyber\s*Crime\s*(?:Cell|Police|Branch)\b'
        - '\bCrime\s*Branch\b'
        - '\bMumbai\s*Police\b'
        - '\bDelhi\s*Police\b'
        - '\bSupreme\s*Court\b'
        # Government / telecom
        - '\bIndia\s*Post\b'
        - '\bIncome\s*Tax\b'
        - '\bIT\s*Department\b'
        - '\bAadhaar\b'
        - '\bEPFO\b'
        - '\bIRCTC\b'
        - '\bJio\b'
        - '\bAirtel\b'
        - '\bVodafone\b'
        - '\bVi\b'
        - '\bBSNL\b'
        - '\bTRAI\b'
        - '\bDoT\b'
        - '\bRBI\b'
        # E-commerce
        - '\bAmazon\b'
        - '\bFlipkart\b'
        - '\bMyntra\b'
        - '\bSwiggy\b'
        - '\bZomato\b'
        # Entertainment & Streaming
        - '\b(?:Netflix|Prime\s*Video|Disney\+?\s*Hotstar|Hotstar|Spotify)\b'
        # Global
        - '\bMicrosoft\b'
        - '\bApple\b'
        - '\bGoogle\b'
        - '\bWhatsApp\b'
        - '\bFedEx\b'
        - '\bDHL\b'
        # Hindi brands
        - '\b(?:एसबीआई|एचडीएफसी|आईसीआईसीआई|पेटीएम|फोनपे|गूगल\s*पे|सीबीआई|ईडी|पुलिस|नेटफ्लिक्स|हॉटस्टार)\b'

    - id: bait_lure
      category: bait
      label: Too-good lure / fake offer
      label_hi: "अवास्तविक प्रलोभन या इनाम"
      points: 20
      reason: "Offers an unrealistic reward, lottery, cashback, or fake job designed to tempt you into impulsive action."
      reason_hi: "अवास्तविक लॉटरी, इनाम, या पार्ट-टाइम नौकरी का लालच देकर आपको बिना सोचे-समझे कदम उठाने के लिए उकसाया जा रहा है।"
      patterns:
        - '\b(?:won|winner|congratulations?|congrats)\b'
        - '\b(?:prize|reward|cashback|refund|lottery|lucky\s*draw)\b'
        - '\b(?:free\s*(?:gift|iphone|phone|laptop|money|recharge))\b'
        - '\b(?:job\s*offer|earn\s*(?:from\s*home|daily|lakhs?|crores?))\b'
        - '\b(?:claim\s*(?:your|now|today))\b'
        - '\b(?:part[- ]time\s*job|earn\s*(?:Rs|₹|INR)?\s*\d+\s*(?:to|-)\s*\d+\s*(?:per\s*day|daily))\b'
        - '\b(?:like\s*(?:youtube|videos|posts)\s*and\s*earn)\b'
        - '\b(?:(?:rate|review)\s*(?:hotels?|restaurants?|movies?)|hotel\s*ratings?|hotel\s*review|task\s*to\s*earn)\b'
        - '\b(?:telegram\s*(?:task|group|channel)\s*for\s*(?:income|earn|profit))\b'
        - '\b(?:guaranteed\s*(?:returns?|profit)|crypto\s*investment\s*scheme)\b'
        - '\b(?:jeeta|jeet\s*gaye|inam|inaam|muft)\b'
        - '\b(?:जीता|जीत\s*गये|जीत\s*गए|इनाम|मुफ़्त|मुफ्त|कैशबैक|रिफंड|लॉटरी|घर\s*बैठे\s*कमाएं|पार्ट\s*टाइम\s*जॉब)\b'

    # ── HOOK ──────────────────────────────────────────────────────────────────
    - id: hook_pressure
      category: hook
      label: Urgency / pressure
      label_hi: "जल्दबाज़ी/दबाव"
      points: 15
      reason: "Creates artificial time urgency ('immediately', 'within 2 hours', 'tonight') to prevent you from pausing or verifying."
      reason_hi: "कृत्रिम जल्दबाज़ी ('तुरंत', '2 घंटे में', 'आज रात') पैदा की गई है ताकि आपको सोचने या सत्यापन करने का समय न मिले।"
      patterns:
        - '\b(?:immediately|urgent|urgently|right\s*now)\b'
        - '\b(?:within\s*\d+\s*(?:hour|hr|minute|min)s?)\b'
        - '\b(?<!delivered\s)(?<!arriving\s)(?<!delivery\s)(?:today|tonight|now\s*only|last\s*chance|act\s*now|limited\s*time)\b'
        - '\b(?:today\s+only|valid\s+today|expires?\s+today|pay\s+today|last\s+day\s+today|act\s+today)\b'
        - '\b(?:expir(?:e|es|ing|ed)\s*(?:today|soon|tonight))\b'
        - '\b(?:turant|fauran|jaldi|abhi)\b'
        - '\b(?:aaj\s*hi|aaj\s*tak|aaj\s*ke\s*andar|aaj\s*raat)\b'
        - '\b(?:तुरंत|फ़ौरन|फौरन|जल्दी|अभी|आज\s*ही|आज\s*तक|आज\s*रात)\b'

    - id: hook_fear
      category: hook
      label: Fear / threat
      label_hi: "डर/धमकी"
      points: 15
      reason: "Uses threats of account blockage, legal action, arrest, electricity cutoff, or service cancellation to trigger panic."
      reason_hi: "खाता बंद होने, कानूनी कार्रवाई, गिरफ्तारी, बिजली कटने, या सिम/सब्सक्रिप्शन निलंबन का डर दिखाकर घबराहट पैदा की जा रही है।"
      patterns:
        - '\b(?:KYC\b.{0,25}?\b(?:incomplete|expire[ds]?|pending|update|verify|verification))\b'
        - '\b(?:account\b.{0,30}?\b(?:block(?:ed)?|suspend(?:ed)?|deactivat(?:e|ed)|clos(?:e|ed)|restrict(?:ed)?))\b'
        - '\b(?:legal\s*action|police\s*complaint|arrest\s*warrant|court\s*notice)\b'
        - '\b(?:SIM\b.{0,25}?\b(?:deactivat(?:e|ed)|block(?:ed)?|suspend(?:ed)?|KYC))\b'
        - '\b(?:electricity\b.{0,30}?\b(?:disconnect(?:ed)?|cut\s*off|power\s*cut|tonight|unpaid\s*bill))\b'
        - '\b(?:subscription\b.{0,25}?\b(?:suspended|cancelled|expired|on\s*hold)|membership\s*on\s*hold)\b'
        - '\b(?:digital\s*arrest|digital\s*custody|video\s*call\s*(?:police|cbi|investigation)|contraband|drugs?\s*found|money\s*laundering)\b'
        - '\b(?:verify\s*(?:your\s*)?identity|failure\s*to\s*comply)\b'
        - '\b(?:penalty|fine\s*of|prosecution)\b'
        - '\b(?:band\s*ho\s*(?:jayega|jayegi|jaega)|block\s*ho|suspend\s*ho|bijli\s*kat)\b'
        - '\b(?:बंद\s*हो\s*जाएगा|बंद\s*हो\s*जाएगी|ब्लॉक|निलंबित|कानूनी\s*कार्रवाई|डिजिटल\s*अरेस्ट|बिजली\s*कट|बिजली\s*कट\s*जाएगी|सिम\s*बंद)\b'

    # ── ASK ───────────────────────────────────────────────────────────────────
    - id: ask_link
      category: ask
      label: Risky link
      label_hi: "संदिग्ध लिंक"
      points: 25
      reason: "Directs you to an unverified, look-alike, or shortened web link intended to capture personal or financial data."
      reason_hi: "अपुष्ट, मिलती-जुलती या शॉर्ट की गई वेबसाइट का लिंक दिया गया है जो व्यक्तिगत या बैंकिंग डेटा चुराने के लिए बनाया गया है।"
      patterns: []

    - id: ask_payment
      category: ask
      label: Payment request
      label_hi: "भुगतान की माँग"
      points: 30
      reason: "Demands upfront payment, processing charges, card updates, or transfer to an unknown account."
      reason_hi: "अग्रिम शुल्क, कार्ड अपडेट, प्रोसेसिंग फीस या अज्ञात खाते में पैसे भेजने की माँग की जा रही है।"
      patterns:
        - '\b(?:pay\s*(?:Rs|₹|INR)?\s*\d+)\b'
        - '\b(?:(?:Rs|₹|INR)\s*\d+\s*(?:fee|charge|fine|penalty))\b'
        - '\b(?:fee\s*of\s*(?:Rs|₹|INR)?\s*\d+)\b'
        - '\b(?:transfer|send)\s*(?:Rs|₹|INR)\s*\d+'
        - '\b(?:processing\s*fee|shipping\s*fee|delivery\s*charge)\b'
        - '\b(?:update\s*(?:your\s*)?(?:card|credit\s*card|debit\s*card|payment\s*method|billing(?:\s*info)?))\b'
        - '\b(?:भुगतान|शुल्क|फीस)\b'
        - '\b(?:paisa|paise)\s*(?:bhej|de|do|send)\b'

    - id: ask_otp
      category: ask
      label: OTP / PIN / credential request
      label_hi: "OTP/PIN/पासवर्ड माँगा"
      points: 40
      reason: "Asks for confidential security credentials (OTP, PIN, CVV, 6-digit code, password) which legitimate banks and services NEVER request."
      reason_hi: "गोपनीय सुरक्षा कोड (OTP, PIN, CVV, 6-अंकीय कोड, पासवर्ड) माँगा जा रहा है। कोई भी वैध बैंक या संस्था कभी OTP नहीं माँगती।"
      patterns:
        - '\b(?:share|send|enter|tell|give|provide|bata|batao|bataye|dein|dijiye|bhej)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:O[\s.-]*T[\s.-]*P|P[\s.-]*I[\s.-]*N|C[\s.-]*V[\s.-]*V|password|passcode|card\s*number|ATM\s*pin|(?:6|4)[- ]digit\s*(?:code|pin)|verification\s*code|security\s*code)\b'
        - '\b(?:O[\s.-]*T[\s.-]*P|P[\s.-]*I[\s.-]*N|C[\s.-]*V[\s.-]*V|password|passcode|card\s*number|ATM\s*pin|(?:6|4)[- ]digit\s*(?:code|pin)|verification\s*code|security\s*code)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:share|send|enter|tell|give|provide|bata|batao|bataye|dein|dijiye|bhej)\b'
        - '\b(?:O[\s.-]*T[\s.-]*P|पिन|ओटीपी|सीवीवी|पासवर्ड|कोड)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:बताएं|बताइए|भेजें|दें|दीजिए|बता\s*दो|बता\s*दें|शेयर)\b'
        - '\b(?:बताएं|बताइए|भेजें|दें|दीजिए|बता\s*दो|बता\s*दें|शेयर)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:O[\s.-]*T[\s.-]*P|पिन|ओटीपी|सीवीवी|पासवर्ड|कोड)\b'

    - id: ask_remote_access
      category: ask
      label: Remote access app request
      label_hi: "रिमोट कंट्रोल ऐप डाउनलोड करने को कहा"
      points: 35
      reason: "Instructs you to install screen-sharing or remote desktop software which gives scammers complete access to your phone and banking apps."
      reason_hi: "स्क्रीन-शेयरिंग या रिमोट एक्सेस ऐप (जैसे AnyDesk/TeamViewer) इंस्टॉल करने को कहा गया है, जिससे धोखेबाज आपके पूरे फोन और बैंक को नियंत्रित कर सकते हैं।"
      patterns:
        - '\b(?:install|download|open)\b.{0,30}?\b(?:AnyDesk|TeamViewer|QuickSupport|RustDesk|UltraViewer|AirDroid)\b'
        - '\b(?:AnyDesk|TeamViewer|QuickSupport|RustDesk|UltraViewer|AirDroid)\b.{0,30}?\b(?:install|download|open)\b'
        - '\b(?:एनीडेस्क|टीमव्यूअर|क्विकसपोर्ट)\b'

    - id: ask_collect_request
      category: ask
      label: Fraudulent UPI collect / refund trick
      label_hi: "फर्जी UPI पिन या कलेक्ट रिक्वेस्ट"
      points: 40
      reason: "Instructs you to enter your UPI PIN or accept a collect request to 'receive' money. UPI PIN is ONLY used to send money, NEVER to receive funds."
      reason_hi: "पैसे 'पाने' के लिए UPI PIN डालने या कलेक्ट रिक्वेस्ट स्वीकार करने को कहा गया है। UPI PIN केवल पैसे भेजने के लिए होता है, पाने के लिए कभी नहीं।"
      patterns:
        - '\b(?:enter\s*(?:UPI\s*)?PIN\s*(?:to|for)\s*(?:receive|credit|get|accept)\s*(?:money|cashback|refund))\b'
        - '\b(?:approve|accept)\s*(?:UPI\s*)?(?:collect|request|payment)\s*(?:to|for)\s*(?:receive|get)\b'
        - '\b(?:पिन\s*डालें\s*पैसे\s*पाने\s*के\s*लिए|कलेक्ट\s*रिक्वेस्ट\s*स्वीकार)\b'

    - id: ask_apk_install
      category: ask
      label: Dangerous APK installation
      label_hi: "संदिग्ध APK ऐप फाइल डाउनलोड"
      points: 35
      reason: "Urges downloading an unverified Android APK file outside the official Google Play Store, typically containing banking spyware or SMS stealers."
      reason_hi: "आधिकारिक प्ले स्टोर से बाहर संदिग्ध Android APK फाइल डाउनलोड करने को कहा गया है, जो बैंकिंग डेटा और SMS चुराने वाला मैलवेयर हो सकता है।"
      patterns:
        - '\b(?:download|install|update)\b.{0,30}?\b(?:\.apk|apk\s*file|app\s*from\s*link)\b'
        - '\b(?:sbi|pnb|hdfc|kyc|challan|electricity|bill|pan|aadhaar)\w*\.apk\b'
        - '\b(?:\.apk|एपीके|एप\s*डाउनलोड\s*करें)\b'

  # Protective context: if these patterns appear in the same sentence as OTP/PIN, void that finding
  protective_context:
    patterns:
      - '\b(?:never|do\s*not|don''t|donot|kabhi\s*(?:mat|nahi|nahin))\b.{0,40}?\b(?:share|tell|give|bata|batao|bataye|dein)\b'
      - '\b(?:(?:share|tell|give|bata)\s*(?:mat|nahi|nahin|na)\s*(?:kare|karein|karna|karo)?)\b'
      - '\b(?:कभी\s*(?:मत|नहीं|ना)\b.{0,40}?\b(?:बताएं|दें|शेयर))\b'
      - '\b(?:never\s*share)\b'


# ── RULEBOOK_MODE ─────────────────────────────────────────────────────────────
# Organisers' sample scoring rubric
rulebook:
  act_now_bonus: 0           # not used in this mode
  max_score: 100
  no_ask_cap: 100            # no Bait/Hook/Ask cap

  tiers:
    low:    [0, 29]
    medium: [30, 59]
    high:   [60, 100]

  rules:
    - id: rb_urgency
      category: hook
      label: Fake urgency
      label_hi: "नकली जल्दबाज़ी"
      points: 20
      reason: "Creates artificial time urgency to force an unconsidered reaction."
      reason_hi: "जल्दबाज़ी पैदा की गई है ताकि बिना सोचे कदम उठाया जाए।"
      patterns:
        - '\b(?:immediately|urgent|urgently|right\s*now)\b'
        - '\b(?:within\s*\d+\s*(?:hour|hr|minute|min)s?)\b'
        - '\b(?<!delivered\s)(?<!arriving\s)(?<!delivery\s)(?:today|tonight|now\s*only|last\s*chance|act\s*now|limited\s*time)\b'
        - '\b(?:today\s+only|valid\s+today|expires?\s+today|pay\s+today|act\s+today)\b'
        - '\b(?:turant|fauran|jaldi|abhi)\b'
        - '\b(?:aaj\s*hi|aaj\s*tak)\b'
        - '\b(?:तुरंत|फ़ौरन|फौरन|जल्दी|अभी|आज\s*ही)\b'

    - id: rb_account_threat
      category: hook
      label: Account threat
      label_hi: "खाते की धमकी"
      points: 15
      reason: "Threatens loss of access or penalty to provoke panic."
      reason_hi: "घबराहट पैदा करने के लिए खाता बंद होने या दंड का डर दिखाया गया है।"
      patterns:
        - '\b(?:KYC\b.{0,25}?\b(?:incomplete|expire[ds]?|pending|update|verify|verification))\b'
        - '\b(?:account\b.{0,30}?\b(?:block(?:ed)?|suspend(?:ed)?|deactivat(?:e|ed)|clos(?:e|ed)|restrict(?:ed)?))\b'
        - '\b(?:SIM\s*(?:deactivat(?:e|ed)|block(?:ed)?|suspend(?:ed)?))\b'
        - '\b(?:band\s*ho\s*(?:jayega|jayegi|jaega)|block\s*ho|suspend\s*ho)\b'
        - '\b(?:बंद\s*हो\s*जाएगा|बंद\s*हो\s*जाएगी|ब्लॉक|निलंबित)\b'

    - id: rb_link
      category: ask
      label: Suspicious link
      label_hi: "संदिग्ध लिंक"
      points: 25
      reason: "Directs to an unverified web destination."
      reason_hi: "अपुष्ट वेब लिंक की ओर निर्देशित करता है।"
      patterns: []

    - id: rb_otp
      category: ask
      label: OTP request
      label_hi: "OTP माँगा"
      points: 40
      reason: "Direct request for an OTP or authentication code."
      reason_hi: "प्रमाणीकरण कोड या OTP की सीधी माँग।"
      patterns:
        - '\b(?:share|send|enter|tell|give|provide|bata|batao|bataye|dein|dijiye|bhej)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:O[\s.-]*T[\s.-]*P|P[\s.-]*I[\s.-]*N|C[\s.-]*V[\s.-]*V|password|passcode|card\s*number|ATM\s*pin)\b'
        - '\b(?:O[\s.-]*T[\s.-]*P|P[\s.-]*I[\s.-]*N|C[\s.-]*V[\s.-]*V|password|passcode|card\s*number|ATM\s*pin)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:share|send|enter|tell|give|provide|bata|batao|bataye|dein|dijiye|bhej)\b'
        - '\b(?:O[\s.-]*T[\s.-]*P|पिन|ओटीपी|सीवीवी|पासवर्ड)\b[^.!?;\n\u0964\u0965]{0,60}?\b(?:बताएं|बताइए|भेजें|दें|दीजिए|बता\s*दो|बता\s*दें)\b'

  protective_context:
    patterns:
      - '\b(?:never|do\s*not|don''t|donot|kabhi\s*(?:mat|nahi|nahin))\b.{0,40}?\b(?:share|tell|give|bata|batao|bataye|dein)\b'
      - '\b(?:never\s*share)\b'
      - '\b(?:कभी\s*(?:मत|नहीं|ना)\b.{0,40}?\b(?:बताएं|दें|शेयर))\b'
